<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7e3a1"/>
      <stop offset="50%" stop-color="#cca34e"/>
      <stop offset="100%" stop-color="#8b651f"/>
    </linearGradient>
    <linearGradient id="g2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fae9b4"/>
      <stop offset="50%" stop-color="#d4ae5e"/>
      <stop offset="100%" stop-color="#967028"/>
    </linearGradient>
    <clipPath id="cruzamento">
      <rect x="24" y="14" width="18" height="22"/>
    </clipPath>
  </defs>
  <!-- Aliança esquerda -->
  <circle cx="23" cy="34" r="15" fill="none" stroke="url(#g1)" stroke-width="5.5"/>
  <!-- Aliança direita -->
  <circle cx="41" cy="30" r="15" fill="none" stroke="url(#g2)" stroke-width="5.5"/>
  <!-- Trecho superior da aliança esquerda passando por cima da direita -->
  <circle cx="23" cy="34" r="15" fill="none" stroke="url(#g1)" stroke-width="5.5" clip-path="url(#cruzamento)"/>
  <!-- Brilhos -->
  <path d="M 15 24 A 15 15 0 0 1 25 19" fill="none" stroke="#fff7dc" stroke-width="1.5" stroke-linecap="round" opacity=".85"/>
  <path d="M 35 16.5 A 15 15 0 0 1 46 17.5" fill="none" stroke="#fff7dc" stroke-width="1.5" stroke-linecap="round" opacity=".85"/>
</svg>
